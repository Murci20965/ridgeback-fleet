name: Weekly report

on:
  schedule:
    # 05:07 UTC on Monday is 07:07 SAST, after the last ingest backup at 06:37 SAST. It's off the
    # hour because GitHub drops runs under load. The 06:07 UTC run is a backup, and it does
    # nothing if the figures haven't changed, or rewrites the report if late data arrived.
    - cron: "7 5 * * 1"
    - cron: "7 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Write the commentary again, even if the figures haven't changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-report

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r app/api/requirements.txt
      - name: Publish the report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: python pipeline/weekly_report.py $FORCE_FLAG
