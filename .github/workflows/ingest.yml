name: Daily ingest

on:
  schedule:
    # 02:07 UTC is 04:07 SAST. GitHub delays or drops scheduled runs under load, worst at the
    # start of the hour, and dropped the first run at 02:00. The later runs are backups until
    # 07:00 SAST. A run that finds nothing new loads nothing, so they cost seconds.
    - cron: "7 2 * * *"
    - cron: "37 2 * * *"
    - cron: "37 3 * * *"
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Reprocess files already loaded (the data ends up identical)
        type: boolean
        default: false

permissions:
  contents: read

# A second run queues rather than overlapping. The pipeline's advisory lock is the backstop.
concurrency:
  group: ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r pipeline/requirements.txt
      - name: Load new files
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: python pipeline/run.py $FORCE_FLAG
