<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L9 5L1 9z" fill="#48484a"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<text x="20" y="44" font-size="32" font-weight="600" fill="#1d1d1f">Ridgeback fleet data: production solution design</text>
<rect x="20" y="98" width="1880" height="172" rx="16" fill="#eeeef2" stroke="#0071e3" stroke-width="2"/>
<text x="20" y="88" font-size="25" font-weight="600" fill="#1d1d1f">Ingest: runs unattended every morning</text>
<rect x="20" y="318" width="1880" height="142" rx="16" fill="#eeeef2" stroke="#0071e3" stroke-width="2"/>
<text x="20" y="308" font-size="25" font-weight="600" fill="#1d1d1f">Store</text>
<rect x="20" y="508" width="1880" height="344" rx="16" fill="#eeeef2" stroke="#0071e3" stroke-width="2"/>
<text x="20" y="498" font-size="25" font-weight="600" fill="#1d1d1f">Serve: dashboard and chat</text>
<rect x="20" y="900" width="1880" height="168" rx="16" fill="#eeeef2"/>
<text x="20" y="890" font-size="25" font-weight="600" fill="#1d1d1f">When files are late, missing or corrupt</text>
<text x="40" y="134" font-size="23" font-weight="600" fill="#1d1d1f">Telematics provider</text>
<rect x="40" y="144" width="320" height="110" rx="12" fill="#ffffff" stroke="#86868b" stroke-width="2"/>
<text x="60" y="192.0" font-size="19" fill="#3a3a3c">Sends yesterday&#x27;s events</text>
<text x="60" y="217.0" font-size="19" fill="#3a3a3c">as a CSV at 04:00</text>
<text x="420" y="134" font-size="23" font-weight="600" fill="#1d1d1f">SFTP folder</text>
<rect x="420" y="144" width="320" height="110" rx="12" fill="#ffffff" stroke="#86868b" stroke-width="2"/>
<text x="440" y="179.5" font-size="19" fill="#3a3a3c">Client&#x27;s folder</text>
<text x="440" y="204.5" font-size="19" fill="#3a3a3c">Stands in for data/incoming</text>
<text x="440" y="229.5" font-size="19" fill="#3a3a3c">in this build</text>
<text x="800" y="134" font-size="23" font-weight="600" fill="#1d1d1f">Scheduled runner</text>
<rect x="800" y="144" width="320" height="110" rx="12" fill="#ffffff" stroke="#86868b" stroke-width="2"/>
<text x="820" y="179.5" font-size="19" fill="#3a3a3c">GitHub Actions cron, 04:00 SAST</text>
<text x="820" y="204.5" font-size="19" fill="#3a3a3c">Retries hourly until 07:00</text>
<text x="820" y="229.5" font-size="19" fill="#3a3a3c">Option: n8n Schedule trigger</text>
<text x="1180" y="134" font-size="23" font-weight="600" fill="#1d1d1f">Python pipeline</text>
<rect x="1180" y="144" width="320" height="110" rx="12" fill="#ffffff" stroke="#86868b" stroke-width="2"/>
<text x="1200" y="179.5" font-size="19" fill="#3a3a3c">Cleans rows, oldest file first</text>
<text x="1200" y="204.5" font-size="19" fill="#3a3a3c">One transaction per file</text>
<text x="1200" y="229.5" font-size="19" fill="#3a3a3c">Safe to rerun: unique event keys</text>
<text x="1560" y="134" font-size="23" font-weight="600" fill="#b00012">Alerts</text>
<rect x="1560" y="144" width="320" height="110" rx="12" fill="#ffffff" stroke="#d70015" stroke-width="2"/>
<text x="1580" y="192.0" font-size="19" fill="#3a3a3c">Email or Slack webhook</text>
<text x="1580" y="217.0" font-size="19" fill="#3a3a3c">Failed, partial or missing files</text>
<text x="40" y="354" font-size="23" font-weight="600" fill="#1d1d1f">Object storage (production)</text>
<rect x="40" y="364" width="460" height="80" rx="12" fill="#dcdce2" stroke="#86868b" stroke-width="2"/>
<text x="60" y="397.0" font-size="19" fill="#1d1d1f">Raw files kept as delivered</text>
<text x="60" y="422.0" font-size="19" fill="#1d1d1f">Bad files moved to quarantine</text>
<text x="540" y="354" font-size="23" font-weight="600" fill="#1d1d1f">Neon Postgres</text>
<rect x="540" y="364" width="780" height="80" rx="12" fill="#dcdce2" stroke="#86868b" stroke-width="2"/>
<text x="560" y="397.0" font-size="19" fill="#1d1d1f">telemetry_events, machines, drivers, branches</text>
<text x="560" y="422.0" font-size="19" fill="#1d1d1f">Views: v_machine_daily_hours, v_driver_events, v_branch_daily</text>
<text x="1360" y="354" font-size="23" font-weight="600" fill="#1d1d1f">Run log</text>
<rect x="1360" y="364" width="520" height="80" rx="12" fill="#dcdce2" stroke="#86868b" stroke-width="2"/>
<text x="1380" y="397.0" font-size="19" fill="#1d1d1f">Postgres ingest_runs: file, rows, outcome</text>
<text x="1380" y="422.0" font-size="19" fill="#1d1d1f">Postgres rejected_rows: raw row and reason</text>
<text x="40" y="544" font-size="23" font-weight="600" fill="#1d1d1f">Operations manager</text>
<rect x="40" y="554" width="240" height="206" rx="12" fill="#ffffff" stroke="#86868b" stroke-width="2"/>
<text x="60" y="650.0" font-size="19" fill="#3a3a3c">Browser on phone,</text>
<text x="60" y="675.0" font-size="19" fill="#3a3a3c">tablet or desktop</text>
<text x="370" y="544" font-size="23" font-weight="600" fill="#1d1d1f">Next.js on Vercel</text>
<rect x="370" y="554" width="320" height="80" rx="12" fill="#ffffff" stroke="#86868b" stroke-width="2"/>
<text x="390" y="587.0" font-size="19" fill="#3a3a3c">Dashboard and chat UI</text>
<text x="390" y="612.0" font-size="19" fill="#3a3a3c">No secrets, no database</text>
<text x="760" y="544" font-size="23" font-weight="600" fill="#1d1d1f">FastAPI: /api/v1/dashboard</text>
<rect x="760" y="554" width="350" height="80" rx="12" fill="#ffffff" stroke="#86868b" stroke-width="2"/>
<text x="780" y="587.0" font-size="19" fill="#3a3a3c">Runs shared SQL queries</text>
<text x="780" y="612.0" font-size="19" fill="#3a3a3c">On each page view, cached 60s</text>
<text x="1190" y="544" font-size="23" font-weight="600" fill="#0058b0">OpenRouter (LLM call)</text>
<rect x="1190" y="554" width="320" height="80" rx="12" fill="#dcebfc" stroke="#0071e3" stroke-width="2"/>
<text x="1210" y="587.0" font-size="19" fill="#1d1d1f">Claude Haiku 5.5, with fallback</text>
<text x="1210" y="612.0" font-size="19" fill="#1d1d1f">Called only from FastAPI</text>
<text x="370" y="670" font-size="23" font-weight="600" fill="#1d1d1f">FastAPI: /api/v1/chat</text>
<rect x="370" y="680" width="320" height="80" rx="12" fill="#ffffff" stroke="#86868b" stroke-width="2"/>
<text x="390" y="713.0" font-size="19" fill="#3a3a3c">Rate and length limits</text>
<text x="390" y="738.0" font-size="19" fill="#3a3a3c">Tool loop, 5 rounds at most</text>
<text x="760" y="670" font-size="23" font-weight="600" fill="#1d1d1f">Typed read-only tools</text>
<rect x="760" y="680" width="350" height="80" rx="12" fill="#dcdce2" stroke="#86868b" stroke-width="2"/>
<text x="780" y="713.0" font-size="19" fill="#1d1d1f">Run hours, events, fleet, coverage</text>
<text x="780" y="738.0" font-size="19" fill="#1d1d1f">Parameterised SQL, none free-form</text>
<text x="1190" y="670" font-size="23" font-weight="600" fill="#1d1d1f">Answer guard</text>
<rect x="1190" y="680" width="320" height="80" rx="12" fill="#ffffff" stroke="#86868b" stroke-width="2"/>
<text x="1210" y="713.0" font-size="19" fill="#3a3a3c">Figure not in a tool result:</text>
<text x="1210" y="738.0" font-size="19" fill="#3a3a3c">one retry, then withheld</text>
<text x="1580" y="544" font-size="23" font-weight="600" fill="#1d1d1f">Where secrets live</text>
<rect x="1580" y="554" width="300" height="286" rx="12" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="2"/>
<text x="1600" y="602.5" font-size="19" fill="#ffffff">Vercel env vars:</text>
<text x="1600" y="627.5" font-size="19" fill="#ffffff">OPENROUTER_API_KEY</text>
<text x="1600" y="652.5" font-size="19" fill="#ffffff">DATABASE_URL (read-only)</text>
<text x="1600" y="677.5" font-size="19" fill="#ffffff">The key has a spend cap</text>
<text x="1600" y="702.5" font-size="19" fill="#ffffff"></text>
<text x="1600" y="727.5" font-size="19" fill="#ffffff">GitHub Actions secret:</text>
<text x="1600" y="752.5" font-size="19" fill="#ffffff">DATABASE_URL (owner)</text>
<text x="1600" y="777.5" font-size="19" fill="#ffffff"></text>
<text x="1600" y="802.5" font-size="19" fill="#ffffff">Never in the repo or browser</text>
<text x="40" y="936" font-size="23" font-weight="600" fill="#b00012">Late data</text>
<rect x="40" y="946" width="437" height="106" rx="12" fill="#ffffff" stroke="#d70015" stroke-width="2"/>
<text x="60" y="979.5" font-size="19" fill="#3a3a3c">Rows keep their event date, up to 7 days old</text>
<text x="60" y="1004.5" font-size="19" fill="#3a3a3c">Resent rows load once, by unique key</text>
<text x="60" y="1029.5" font-size="19" fill="#3a3a3c">A late file loads on the next retry</text>
<text x="507" y="936" font-size="23" font-weight="600" fill="#b00012">Missing file</text>
<rect x="507" y="946" width="437" height="106" rx="12" fill="#ffffff" stroke="#d70015" stroke-width="2"/>
<text x="527" y="979.5" font-size="19" fill="#3a3a3c">No file by 07:00 alerts the on-call contact</text>
<text x="527" y="1004.5" font-size="19" fill="#3a3a3c">Gaps between delivery dates are logged</text>
<text x="527" y="1029.5" font-size="19" fill="#3a3a3c">Dashboard and chat show the dates covered</text>
<text x="974" y="936" font-size="23" font-weight="600" fill="#b00012">Corrupt file</text>
<rect x="974" y="946" width="437" height="106" rx="12" fill="#ffffff" stroke="#d70015" stroke-width="2"/>
<text x="994" y="979.5" font-size="19" fill="#3a3a3c">Rolls back that file only, and logs it failed</text>
<text x="994" y="1004.5" font-size="19" fill="#3a3a3c">Later files still load, and the run alerts</text>
<text x="994" y="1029.5" font-size="19" fill="#3a3a3c">Quarantined until a corrected copy arrives</text>
<text x="1443" y="936" font-size="23" font-weight="600" fill="#b00012">Bad rows in a good file</text>
<rect x="1443" y="946" width="437" height="106" rx="12" fill="#ffffff" stroke="#d70015" stroke-width="2"/>
<text x="1463" y="979.5" font-size="19" fill="#3a3a3c">Stored in rejected_rows with a reason</text>
<text x="1463" y="1004.5" font-size="19" fill="#3a3a3c">Good rows load; truncated means partial</text>
<text x="1463" y="1029.5" font-size="19" fill="#3a3a3c">Unknown machines held until listed</text>
