<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#6e6e73"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="20" y="34" font-size="26" font-weight="600" fill="#1d1d1f">Ridgeback fleet data: production solution design</text>
<rect x="20" y="72" width="1560" height="126" rx="14" fill="#f5f5f7"/>
<text x="20" y="64" font-size="20" font-weight="600" fill="#1d1d1f">Ingest: runs unattended every morning</text>
<rect x="20" y="232" width="1560" height="106" rx="14" fill="#f5f5f7"/>
<text x="20" y="224" font-size="20" font-weight="600" fill="#1d1d1f">Store</text>
<rect x="20" y="372" width="1560" height="296" rx="14" fill="#f5f5f7"/>
<text x="20" y="364" font-size="20" font-weight="600" fill="#1d1d1f">Serve: dashboard and chat</text>
<rect x="20" y="700" width="1560" height="186" rx="14" fill="#f5f5f7"/>
<text x="20" y="692" font-size="20" font-weight="600" fill="#1d1d1f">When files are late, missing or corrupt</text>
<text x="40" y="100" font-size="19" font-weight="600" fill="#1d1d1f">Telematics provider</text>
<rect x="40" y="108" width="230" height="80" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
<text x="54" y="143.0" font-size="16" fill="#515154">Sends yesterday&#x27;s events</text>
<text x="54" y="163.0" font-size="16" fill="#515154">as a CSV at 04:00</text>
<text x="300" y="100" font-size="19" font-weight="600" fill="#1d1d1f">SFTP folder</text>
<rect x="300" y="108" width="230" height="80" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
<text x="314" y="133.0" font-size="16" fill="#515154">Client&#x27;s folder</text>
<text x="314" y="153.0" font-size="16" fill="#515154">Stands in for data/incoming</text>
<text x="314" y="173.0" font-size="16" fill="#515154">in this build</text>
<text x="560" y="100" font-size="19" font-weight="600" fill="#1d1d1f">Scheduled runner</text>
<rect x="560" y="108" width="310" height="80" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
<text x="574" y="133.0" font-size="16" fill="#515154">GitHub Actions cron, 04:00 SAST</text>
<text x="574" y="153.0" font-size="16" fill="#515154">Retries hourly until 07:00</text>
<text x="574" y="173.0" font-size="16" fill="#515154">Option: n8n Schedule trigger</text>
<text x="900" y="100" font-size="19" font-weight="600" fill="#1d1d1f">Python pipeline</text>
<rect x="900" y="108" width="310" height="80" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
<text x="914" y="133.0" font-size="16" fill="#515154">Cleans rows, oldest file first</text>
<text x="914" y="153.0" font-size="16" fill="#515154">One transaction per file</text>
<text x="914" y="173.0" font-size="16" fill="#515154">Safe to rerun: unique event keys</text>
<text x="1240" y="100" font-size="19" font-weight="600" fill="#b00012">Alerts</text>
<rect x="1240" y="108" width="320" height="80" rx="12" fill="#ffffff" stroke="#d70015" stroke-width="1"/>
<text x="1254" y="143.0" font-size="16" fill="#515154">Email or Slack webhook</text>
<text x="1254" y="163.0" font-size="16" fill="#515154">On failed, partial or missing files</text>
<text x="40" y="260" font-size="19" font-weight="600" fill="#1d1d1f">Object storage (production)</text>
<rect x="40" y="268" width="360" height="60" rx="12" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="1"/>
<text x="54" y="293.0" font-size="16" fill="#515154">Raw files kept as delivered</text>
<text x="54" y="313.0" font-size="16" fill="#515154">Bad files moved to quarantine</text>
<text x="430" y="260" font-size="19" font-weight="600" fill="#1d1d1f">Neon Postgres</text>
<rect x="430" y="268" width="640" height="60" rx="12" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="1"/>
<text x="444" y="293.0" font-size="16" fill="#515154">telemetry_events, machines, drivers, branches</text>
<text x="444" y="313.0" font-size="16" fill="#515154">Views: v_machine_daily_hours, v_driver_events, v_branch_daily</text>
<text x="1100" y="260" font-size="19" font-weight="600" fill="#1d1d1f">Run log</text>
<rect x="1100" y="268" width="460" height="60" rx="12" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="1"/>
<text x="1114" y="293.0" font-size="16" fill="#515154">Postgres ingest_runs: file, rows loaded, rejected, outcome</text>
<text x="1114" y="313.0" font-size="16" fill="#515154">Postgres rejected_rows: raw row and the reason</text>
<text x="40" y="400" font-size="19" font-weight="600" fill="#1d1d1f">Operations manager</text>
<rect x="40" y="408" width="200" height="196" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
<text x="54" y="501.0" font-size="16" fill="#515154">Browser on phone,</text>
<text x="54" y="521.0" font-size="16" fill="#515154">tablet or desktop</text>
<text x="290" y="400" font-size="19" font-weight="600" fill="#1d1d1f">Next.js on Vercel</text>
<rect x="290" y="408" width="260" height="80" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
<text x="304" y="443.0" font-size="16" fill="#515154">Dashboard and chat UI</text>
<text x="304" y="463.0" font-size="16" fill="#515154">No secrets, no database</text>
<text x="600" y="400" font-size="19" font-weight="600" fill="#1d1d1f">FastAPI: /api/v1/dashboard</text>
<rect x="600" y="408" width="300" height="80" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
<text x="614" y="443.0" font-size="16" fill="#515154">Runs shared SQL queries</text>
<text x="614" y="463.0" font-size="16" fill="#515154">On each page view, cached 60s</text>
<text x="950" y="400" font-size="19" font-weight="600" fill="#0058b0">OpenRouter (LLM call)</text>
<rect x="950" y="408" width="280" height="80" rx="12" fill="#e8f2fd" stroke="#0071e3" stroke-width="1"/>
<text x="964" y="433.0" font-size="16" fill="#515154">Claude Haiku 5.5, then fallback</text>
<text x="964" y="453.0" font-size="16" fill="#515154">Called only from FastAPI</text>
<text x="964" y="473.0" font-size="16" fill="#515154">Spend cap on the key</text>
<text x="290" y="516" font-size="19" font-weight="600" fill="#1d1d1f">FastAPI: /api/v1/chat</text>
<rect x="290" y="524" width="260" height="80" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
<text x="304" y="549.0" font-size="16" fill="#515154">Rate limit, length limit</text>
<text x="304" y="569.0" font-size="16" fill="#515154">Tool loop, 5 rounds at most</text>
<text x="304" y="589.0" font-size="16" fill="#515154">Runs when a question is sent</text>
<text x="600" y="516" font-size="19" font-weight="600" fill="#1d1d1f">Typed read-only tools</text>
<rect x="600" y="524" width="300" height="80" rx="12" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="1"/>
<text x="614" y="549.0" font-size="16" fill="#515154">Run hours, events, fleet, coverage</text>
<text x="614" y="569.0" font-size="16" fill="#515154">Validated, parameterised SQL</text>
<text x="614" y="589.0" font-size="16" fill="#515154">No free-form SQL</text>
<text x="950" y="516" font-size="19" font-weight="600" fill="#1d1d1f">Answer guard</text>
<rect x="950" y="524" width="280" height="80" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
<text x="964" y="559.0" font-size="16" fill="#515154">Figure not in a tool result:</text>
<text x="964" y="579.0" font-size="16" fill="#515154">one retry, then withheld</text>
<text x="1270" y="400" font-size="19" font-weight="600" fill="#1d1d1f">Where secrets live</text>
<rect x="1270" y="408" width="290" height="244" rx="12" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1"/>
<text x="1284" y="465.0" font-size="16" fill="#f5f5f7">Vercel env vars:</text>
<text x="1284" y="485.0" font-size="16" fill="#f5f5f7">OPENROUTER_API_KEY</text>
<text x="1284" y="505.0" font-size="16" fill="#f5f5f7">DATABASE_URL (read-only role)</text>
<text x="1284" y="525.0" font-size="16" fill="#f5f5f7"></text>
<text x="1284" y="545.0" font-size="16" fill="#f5f5f7">GitHub Actions secret:</text>
<text x="1284" y="565.0" font-size="16" fill="#f5f5f7">DATABASE_URL (owner role)</text>
<text x="1284" y="585.0" font-size="16" fill="#f5f5f7"></text>
<text x="1284" y="605.0" font-size="16" fill="#f5f5f7">Never in the repo or browser</text>
<text x="40" y="728" font-size="19" font-weight="600" fill="#b00012">Late data</text>
<rect x="40" y="736" width="365" height="140" rx="12" fill="#ffffff" stroke="#d70015" stroke-width="1"/>
<text x="54" y="761.0" font-size="16" fill="#515154">A row keeps its event date, wherever</text>
<text x="54" y="781.0" font-size="16" fill="#515154">it arrives, up to 7 days old</text>
<text x="54" y="801.0" font-size="16" fill="#515154">Resent rows hit the unique key,</text>
<text x="54" y="821.0" font-size="16" fill="#515154">so they load once</text>
<text x="54" y="841.0" font-size="16" fill="#515154">A late file loads on the next retry</text>
<text x="54" y="861.0" font-size="16" fill="#515154">Older rows are rejected with a reason</text>
<text x="425" y="728" font-size="19" font-weight="600" fill="#b00012">Missing file</text>
<rect x="425" y="736" width="365" height="140" rx="12" fill="#ffffff" stroke="#d70015" stroke-width="1"/>
<text x="439" y="761.0" font-size="16" fill="#515154">No file by 07:00: alert the</text>
<text x="439" y="781.0" font-size="16" fill="#515154">on-call contact</text>
<text x="439" y="801.0" font-size="16" fill="#515154">A gap between delivery dates is logged</text>
<text x="439" y="821.0" font-size="16" fill="#515154">Dashboard shows the last loaded date</text>
<text x="439" y="841.0" font-size="16" fill="#515154">Chat states which dates it covers</text>
<text x="439" y="861.0" font-size="16" fill="#515154">Backfills load in date order</text>
<text x="810" y="728" font-size="19" font-weight="600" fill="#b00012">Corrupt file</text>
<rect x="810" y="736" width="365" height="140" rx="12" fill="#ffffff" stroke="#d70015" stroke-width="1"/>
<text x="824" y="761.0" font-size="16" fill="#515154">Empty, not UTF-8 or missing a column:</text>
<text x="824" y="781.0" font-size="16" fill="#515154">roll back only that file, log failed</text>
<text x="824" y="801.0" font-size="16" fill="#515154">Later files still load</text>
<text x="824" y="821.0" font-size="16" fill="#515154">The run exits non-zero and alerts</text>
<text x="824" y="841.0" font-size="16" fill="#515154">The file is quarantined, and a</text>
<text x="824" y="861.0" font-size="16" fill="#515154">corrected copy reloads automatically</text>
<text x="1195" y="728" font-size="19" font-weight="600" fill="#b00012">Bad rows in a good file</text>
<rect x="1195" y="736" width="365" height="140" rx="12" fill="#ffffff" stroke="#d70015" stroke-width="1"/>
<text x="1209" y="761.0" font-size="16" fill="#515154">Stored in rejected_rows with a reason</text>
<text x="1209" y="781.0" font-size="16" fill="#515154">Good rows still load</text>
<text x="1209" y="801.0" font-size="16" fill="#515154">Truncated file: outcome is partial,</text>
<text x="1209" y="821.0" font-size="16" fill="#515154">flagged on the dashboard</text>
<text x="1209" y="841.0" font-size="16" fill="#515154">Unknown machine: held until it&#x27;s on</text>
<text x="1209" y="861.0" font-size="16" fill="#515154">the list, then reprocessed</text>
