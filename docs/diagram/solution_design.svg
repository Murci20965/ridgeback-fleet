<text x="725" y="712" text-anchor="middle" font-size="16" fill="#3a3a3c">tool</text>
<text x="1465" y="662" text-anchor="middle" font-size="16" fill="#3a3a3c">draft answer</text>
<text x="970" y="803" text-anchor="middle" font-size="16" fill="#3a3a3c">checked answer, or a clear &#x27;the data can&#x27;t answer&#x27;</text>
