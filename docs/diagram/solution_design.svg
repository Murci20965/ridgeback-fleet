<text x="1130" y="293" text-anchor="middle" font-size="12" fill="#52514e">logs each run</text>
<text x="780" y="293" text-anchor="middle" font-size="12" fill="#52514e">loads events</text>
<text x="690" y="480" text-anchor="middle" font-size="12" fill="#52514e">SQL</text>
<text x="855" y="470" text-anchor="middle" font-size="12" fill="#52514e">read-only SQL</text>
<text x="272" y="545" text-anchor="middle" font-size="12" fill="#52514e">opens</text>
<text x="262" y="712" text-anchor="middle" font-size="12" fill="#52514e">asks</text>
<text x="565" y="562" text-anchor="middle" font-size="12" fill="#52514e">fetch</text>
<text x="565" y="708" text-anchor="middle" font-size="12" fill="#52514e">tool</text>
<text x="700" y="773" text-anchor="middle" font-size="12" fill="#52514e">asks model, sending the tool results</text>
<text x="1078" y="640" text-anchor="middle" font-size="12" fill="#52514e">draft answer</text>
<text x="520" y="516" text-anchor="middle" font-size="12" fill="#52514e">checked answer, or a clear &#x27;the data can&#x27;t answer&#x27;</text>
